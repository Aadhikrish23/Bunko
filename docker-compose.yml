name: bunko

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bunko
      POSTGRES_PASSWORD: bunko
      POSTGRES_DB: bunko
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunko"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-bunko-minio-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-bunko-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-bunko-minio-admin} ${S3_SECRET_ACCESS_KEY:-bunko-minio-secret} &&
      mc mb -p local/${S3_BUCKET:-bunko-dev} &&
      exit 0
      "

volumes:
  postgres-data:
  minio-data:
