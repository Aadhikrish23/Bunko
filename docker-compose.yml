name: bunko

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bunko
      POSTGRES_PASSWORD: bunko
      POSTGRES_DB: bunko
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunko"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-bunko-minio-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-bunko-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-bunko-minio-admin} ${S3_SECRET_ACCESS_KEY:-bunko-minio-secret} &&
      mc mb -p local/${S3_BUCKET:-bunko-dev} &&
      mc anonymous set download local/${S3_BUCKET:-bunko-dev}/covers &&
      exit 0
      "

  # Phase 10 AI layer — optional. Start with `docker compose --profile ai up`
  # after creating its DB role (ai-service/scripts/create_ai_role.sql).
  # Reached only by the Express API, never by browsers (ARCHITECTURE.md §8).
  ai-service:
    profiles: ["ai"]
    build: ./ai-service
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:-postgresql://bunko_ai:change-me@postgres:5432/bunko}
      # Required — the service refuses to start without a 16+ char token.
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      NVIDIA_FALLBACK_MODELS: ${NVIDIA_FALLBACK_MODELS:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ai-models:/home/bunko/.cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  ai-models:
