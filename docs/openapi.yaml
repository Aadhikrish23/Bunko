openapi: 3.0.3
info:
  title: Bunko API
  version: "1.0.0-mvp"
  description: >
    REST API for Bunko MVP (SRS.md Phases 1-5). Binding contract —
    see API_SPEC.md for cross-cutting conventions.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                displayName: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409":
          description: Email already registered

  /auth/login:
    post:
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Exchange a refresh token (httpOnly cookie) for a new access token
      security: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }

  /users/me:
    get:
      summary: Get the authenticated user's own profile (SRS §23)
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
    patch:
      summary: Update the authenticated user's own profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }

  /metadata/search:
    get:
      summary: Search external book metadata to populate an "add book" flow (SRS §16)
      description: >
        Searches book metadata via a resilient multi-tier waterfall (Google Books
        if GOOGLE_BOOKS_API_KEY is configured, enhanced Open Library with multi-key
        cover resolution, and Inventaire.io zero-config fallback; see ARCHITECTURE.md §11),
        returning a provider-agnostic candidate list. Called once per user search,
        not on every page load — see caching note in ARCHITECTURE.md §11.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: lang
          required: false
          schema: { type: string, example: "ja" }
      responses:
        "200":
          description: Candidate matches for the user to pick from
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MetadataCandidate" }

  /works:
    get:
      summary: List the current user's library
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ReadingStatus" }
        - in: query
          name: shelfId
          schema: { type: string, format: uuid }
        - in: query
          name: q
          schema: { type: string }
          description: Search by title/author
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated list of works in the user's library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkListResponse" }
    post:
      summary: Add a book (Work) to the user's library
      description: >
        Accepts either a manually-entered book, or externalSource +
        externalId from a prior /metadata/search result (preferred —
        dedupes against an existing Work per DATA_MODEL.md §4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkRequest" }
      responses:
        "201":
          description: Work added to library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkResponse" }

  /works/{workId}:
    get:
      summary: Get a single work with its editions/copies
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Work detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkResponse" }
        "404": { description: Not found or not owned by caller }
    patch:
      summary: Update reading status or metadata for a work in the library
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/ReadingStatus" }
      responses:
        "200": { description: Updated }
    delete:
      summary: Remove a work from the user's library
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "204": { description: Removed }

  /editions:
    post:
      summary: Add an edition (physical or digital) to a work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEditionRequest" }
      responses:
        "201":
          description: Edition created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditionResponse" }

  /copies:
    post:
      summary: Register a copy (the user's instance of an edition)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [editionId]
              properties:
                editionId: { type: string, format: uuid }
                digitalFileId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Copy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopyResponse" }

  /shelves:
    get:
      summary: List the caller's shelves (SRS §15)
      responses:
        "200":
          description: The caller's shelves
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ShelfResponse" }
    post:
      summary: Create a shelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Shelf created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfResponse" }
        "409":
          description: A shelf with this name already exists for this user

  /shelves/{shelfId}:
    delete:
      summary: Delete a shelf (does not delete the works on it)
      parameters:
        - $ref: "#/components/parameters/ShelfId"
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned by caller }

  /shelves/{shelfId}/works:
    post:
      summary: Assign a work (already in the caller's library) to a shelf
      parameters:
        - $ref: "#/components/parameters/ShelfId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId]
              properties:
                workId: { type: string, format: uuid }
      responses:
        "204": { description: Assigned }
        "404": { description: Shelf or work not found }

  /shelves/{shelfId}/works/{workId}:
    delete:
      summary: Remove a work from a shelf (other shelves are unaffected)
      parameters:
        - $ref: "#/components/parameters/ShelfId"
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed }

  /shelves/arrangement/{tabKey}:
    get:
      summary: Get the caller's saved drag-reorder for one Shelves view, so it follows the account across devices
      description: >-
        tabKey is the same opaque key the Shelves UI already uses for a view:
        "all", "status:<READING_STATUS>", or "shelf:<uuid>". Not every key
        maps to a stored Shelf row — the status-based views are computed
        client-side. Returns an empty workIds array if nothing has been
        saved yet.
      parameters:
        - $ref: "#/components/parameters/TabKey"
      responses:
        "200":
          description: The saved arrangement (empty workIds if none saved yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfArrangementResponse" }
        "404": { description: "tabKey is a shelf:<uuid> the caller does not own" }
    put:
      summary: Save the caller's drag-reorder for one Shelves view
      parameters:
        - $ref: "#/components/parameters/TabKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workIds]
              properties:
                workIds:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfArrangementResponse" }
        "404": { description: "tabKey is a shelf:<uuid> the caller does not own" }

  /files/upload-url:
    post:
      summary: Request a signed URL to upload a digital book file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName: { type: string }
                mimeType: { type: string, enum: [application/epub+zip, application/pdf] }
                sizeBytes: { type: integer }
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fileId: { type: string, format: uuid }
                      uploadUrl: { type: string }
        "413": { description: Exceeds size limit or remaining quota }

  /files/{fileId}/confirm:
    post:
      summary: Confirm and validate an uploaded file
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File validated and ready to attach to a Copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigitalFileResponse" }
        "422": { description: File failed content/type validation }

  /editions/{editionId}/reader-manifest:
    get:
      summary: Get everything the client Reader needs to open a digital edition
      description: >
        Resolves the signed file URL, the last saved position for this
        user (via continuity mapping, SRS §11), and auto-starts a
        reading session (SRS §12.8).
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reader manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReaderManifestResponse" }

  /editions/{editionId}/chapters:
    get:
      summary: Get an edition's chapter-wise text
      description: >
        Chapter boundaries and full readable text per chapter, built by
        the same import-time indexing pipeline as the continuity engine
        (SRS §11.6) — reused here rather than a separate extraction path.
        Powers the flow-reader UI and future chapter-level AI features.
        For a PDF with no bookmark outline, each unit is a page rather
        than a true chapter (no structural signal exists to group
        pages). `text` is empty for a scanned page with no extractable
        text layer — OCR backfill is not yet implemented.
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chapter list with text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChaptersResponse" }

  /works/{workId}/notes:
    get:
      summary: List the caller's standalone notes for a work (SRS §13.1)
      description: >-
        Not a highlight's margin note (see /annotations) — a note with
        no required text selection: book-level, chapter/section/page/
        passage-level (edition-specific, carries copyId), or
        session-level.
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's notes for this work
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
        "404": { description: Work not found in the caller's library }
    post:
      summary: Create a standalone note
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, body]
              properties:
                scope: { type: string, enum: [BOOK, CHAPTER, SECTION, PAGE, PASSAGE, SESSION] }
                position:
                  type: string
                  nullable: true
                  description: Required for CHAPTER/SECTION/PAGE/PASSAGE; omit for BOOK/SESSION.
                copyId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required for CHAPTER/SECTION/PAGE/PASSAGE (the anchor is edition-specific).
                sessionId: { type: string, format: uuid, nullable: true }
                body: { type: string, maxLength: 10000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Note" }
        "404": { description: "Work, copy, or session not found/owned by caller" }

  /notes/{id}:
    patch:
      summary: Update a note's body
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 10000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Note" }
        "404": { description: Not found or not owned by caller }
    delete:
      summary: Delete a note
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned by caller }

  /works/{workId}/review:
    get:
      summary: The caller's own rating/review of a work (SRS §14)
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's review
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Review" }
        "404": { description: "No review yet, or work not in the caller's library" }
    put:
      summary: Create or replace the caller's rating/review of a work
      description: >-
        One review per (userId, workId) — re-rating/re-reviewing
        replaces the existing row rather than erroring.
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
                body: { type: string, maxLength: 10000, nullable: true }
                isFavourite: { type: boolean }
                rereadIntention: { type: boolean }
                metadata: { type: object, nullable: true, additionalProperties: true }
      responses:
        "200":
          description: Created or replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Review" }
        "404": { description: Work not found in the caller's library }
    patch:
      summary: Partially update the caller's existing review
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
                body: { type: string, maxLength: 10000, nullable: true }
                isFavourite: { type: boolean }
                rereadIntention: { type: boolean }
                metadata: { type: object, nullable: true, additionalProperties: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Review" }
        "404": { description: Review not found }
    delete:
      summary: Delete the caller's review
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404": { description: Review not found }

  /soundtracks:
    get:
      summary: The caller's playlists, each with its associations (SRS §17.2)
      responses:
        "200":
          description: Playlists, by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Soundtrack" } }
    post:
      summary: Add a playlist by share link
      description: >-
        The link must be a Spotify, YouTube, Apple Music, or SoundCloud
        playlist/album/track; Bunko embeds the provider's official player
        and never stores or proxies audio (SRS §17.6, T-058). Tracking
        parameters are stripped from the stored link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                url: { type: string, maxLength: 2048 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Soundtrack" }
        "400": { description: "Unsupported link (details[0].field = \"url\")" }

  /soundtracks/{id}:
    patch:
      summary: Rename a playlist or change its link
      parameters:
        - $ref: "#/components/parameters/SoundtrackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                url: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Soundtrack" }
        "400": { description: "Unsupported link, or neither field given" }
        "404": { description: Not found or not owned by caller }
    delete:
      summary: Delete a playlist (its associations go with it)
      parameters:
        - $ref: "#/components/parameters/SoundtrackId"
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned by caller }

  /soundtrack-mappings:
    put:
      summary: Associate a playlist with a book, shelf, genre, mood, or situation
      description: >-
        One playlist per target: mapping a target that already has one
        re-points it. GENRE/MOOD/SITUATION keys are normalised (trimmed,
        whitespace-collapsed, lowercased). WORK/SHELF keys are ids that
        must belong to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [soundtrackId, targetType, targetKey]
              properties:
                soundtrackId: { type: string, format: uuid }
                targetType: { type: string, enum: [WORK, SHELF, GENRE, MOOD, SITUATION] }
                targetKey: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: The association
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SoundtrackMapping" }
        "400": { description: Invalid target }
        "404": { description: "Playlist, book, or shelf not found/owned by caller" }

  /soundtrack-mappings/{id}:
    delete:
      summary: Remove an association
      parameters:
        - $ref: "#/components/parameters/SoundtrackMappingId"
      responses:
        "204": { description: Removed }
        "404": { description: Not found or not owned by caller }

  /works/{workId}/soundtrack:
    get:
      summary: What automatic mode plays for a book (T-061)
      description: >-
        The book's own soundtrack, else one from a shelf it's on (shelves
        by name), else one from its genres (in the book's genre order).
        Moods and situations are manual picks in the player, not
        automatic inputs. `match` is null when nothing applies.
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The automatic pick, if any
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SoundtrackResolution" }
        "404": { description: Work not found in the caller's library }

  /editions/{editionId}/download:
    get:
      summary: "Signed file URL for Download for offline (T-073)"
      description: "Like the reader manifest, but does not start a reading session. Only the caller's own digital copy."
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Download manifest"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fileUrl: { type: string }
                      format: { type: string, enum: [EPUB, PDF] }
                      workId: { type: string, format: uuid }
                      copyId: { type: string, format: uuid }
                      sizeBytes: { type: integer }
        "404": { description: "No digital copy of this edition in the caller's library" }

  /editions/{editionId}/bookmarks:
    get:
      summary: "The caller's bookmarks in an edition (SRS §21.1, T-067)"
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Bookmarks, oldest first"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Bookmark" } }
        "404": { description: "No copy of this edition in the caller's library" }
    post:
      summary: "Add a bookmark"
      description: "An optional client-generated id makes the request idempotent: re-sending it returns the existing bookmark with 200."
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, label]
              properties:
                id: { type: string, format: uuid }
                position: { type: string, maxLength: 500 }
                label: { type: string, maxLength: 120 }
      responses:
        "201": { description: "Created" }
        "200": { description: "Already existed (same client id)" }
        "404": { description: "No copy of this edition in the caller's library" }

  /bookmarks/{id}:
    delete:
      summary: "Delete a bookmark"
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: "Deleted" }
        "404": { description: "Not found or not owned by caller" }

  /preferences:
    get:
      summary: "The caller's synced preferences (T-068)"
      responses:
        "200":
          description: "Preferences by key"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Preference" } }

  /preferences/{key}:
    put:
      summary: "Set a preference, last-write-wins by client timestamp"
      description: "Applies only if updatedAt is newer than the stored value (capped at server time). Always 200; applied=false means a newer value already exists."
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string, enum: [reader-settings, soundtrack] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, updatedAt]
              properties:
                value: { type: object, additionalProperties: true, description: "At most 4 KB as JSON" }
                updatedAt: { type: string, format: date-time }
      responses:
        "200":
          description: "The stored preference, with applied"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Preference"
                      - type: object
                        properties:
                          applied: { type: boolean }

  /sync/devices:
    get:
      summary: "The caller's devices (T-071)"
      responses:
        "200":
          description: "Devices, most recently seen first; current marks the one sending X-Device-Id"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Device" } }
    post:
      summary: "Register this device"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, label]
              properties:
                deviceId: { type: string, format: uuid }
                label: { type: string, maxLength: 80 }
      responses:
        "200": { description: "Registered or refreshed" }

  /sync/events:
    post:
      summary: "Replay offline writes (T-069)"
      description: "Requires X-Device-Id. Events apply in order; each is recorded once per client event id, so a retried batch returns the original results (duplicate=true). Sessions are append-only; annotations, notes, and bookmarks merge; preferences are last-write-wins; a reading position moved by another device during an offline session becomes a CONFLICT (ARCHITECTURE.md §13)."
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [id, type, createdAt, payload]
                    properties:
                      id: { type: string, format: uuid }
                      type:
                        type: string
                        enum: [SESSION_RECORDED, ANNOTATION_CREATED, ANNOTATION_UPDATED, ANNOTATION_DELETED, NOTE_CREATED, NOTE_UPDATED, NOTE_DELETED, BOOKMARK_CREATED, BOOKMARK_DELETED, PREFERENCE_SET]
                      createdAt: { type: string, format: date-time, description: "When the write happened on the device" }
                      payload: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "One result per event, in order"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SyncEventResult" } }
        "400": { description: "Malformed batch or missing X-Device-Id" }

  /sync/conflicts:
    get:
      summary: "Unresolved reading-position conflicts (T-070)"
      responses:
        "200":
          description: "Oldest first"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SyncConflict" } }

  /sync/conflicts/{id}/resolve:
    post:
      summary: "Choose which reading position to continue from"
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: string, enum: [SERVER, DEVICE] }
      responses:
        "204": { description: "Resolved; repeating it is a no-op" }
        "404": { description: "Conflict not found" }

  /ai/status:
    get:
      summary: "AI availability on this server and the caller's consent (T-078)"
      responses:
        "200":
          description: "Status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiStatus" }

  /ai/consent:
    put:
      summary: "Set the caller's AI consent (SRS §20.4)"
      description: "All default to off. generative requires semanticSearch; translation is independent. Turning semanticSearch off deletes the caller's embeddings immediately, and turning it on starts indexing. Turning translation off deletes the caller's saved chapter translations (SRS §20.5). Stores the current policy version."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [semanticSearch, generative, translation]
              properties:
                semanticSearch: { type: boolean }
                generative: { type: boolean }
                translation: { type: boolean }
      responses:
        "200":
          description: "Updated status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiStatus" }
        "400": { description: "generative without semanticSearch" }

  /ai/search:
    get:
      summary: "Semantic search over the caller's own highlights, notes, and reviews (T-081)"
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: "Ranked excerpts"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/AiExcerpt" } }
        "403": { description: "Semantic search consent not given" }
        "503": { description: "AI_UNAVAILABLE" }

  /ai/ask:
    post:
      summary: "Answer a question from the caller's own notes, with citations (T-082)"
      description: "Requires generative consent; counts toward the daily generation cap."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: "Generated answer"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiAnswer" }
        "403": { description: "Generated insights consent not given" }
        "429": { description: "Daily generation limit reached" }
        "503": { description: "AI_UNAVAILABLE" }

  /ai/works/{workId}/summary:
    post:
      summary: "Summarize the caller's thoughts on one book (T-083)"
      parameters:
        - in: path
          name: workId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Generated summary"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiSummary" }
        "400": { description: "Nothing of the caller's to summarize yet" }
        "403": { description: "Generated insights consent not given" }
        "404": { description: "Work not in the caller's library" }
        "429": { description: "Daily generation limit reached" }
        "503": { description: "AI_UNAVAILABLE" }

  /ai/insights:
    post:
      summary: "Patterns in the caller's reading (T-084, SRS §20.3)"
      responses:
        "200":
          description: "Generated insights, labelled as interpretations"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiInsights" }
        "403": { description: "Generated insights consent not given" }
        "429": { description: "Daily generation limit reached" }
        "503": { description: "AI_UNAVAILABLE" }

  /ai/recommendations:
    post:
      summary: "Books to read next, based on the caller's own reading (T-085, SRS §20.2)"
      responses:
        "200":
          description: "Generated recommendations; never books already in the library"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiRecommendations" }
        "403": { description: "Generated insights consent not given" }
        "429": { description: "Daily generation limit reached" }
        "503": { description: "AI_UNAVAILABLE" }

  /assistant/chat:
    post:
      summary: "Send a message to the library assistant (T-096, SRS §20.6)"
      description: "Manages the caller's own library in plain words and answers questions about it. Requires generated-insights consent. Replies that describe a change are built only from what actually ran. Removing a book returns CONFIRMATION_REQUIRED first; send the chosen option label back as the next message. Model calls count toward AI_DAILY_GENERATION_LIMIT; past it the reply has status LIMITED."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                client:
                  type: object
                  properties:
                    pageBookId: { type: string, format: uuid, description: "The book page the reader has open, for 'this one'" }
      responses:
        "200":
          description: "The assistant's reply"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AssistantReply" }
        "400": { description: "Empty or too long message" }
        "403": { description: "Generated insights consent not given" }
        "503": { description: "AI_UNAVAILABLE: the model can't be reached or is too slow" }

  /assistant/reset:
    post:
      summary: "Forget the conversation (Clear in the chat)"
      responses:
        "200":
          description: "Cleared"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { cleared: { type: boolean } } }

  /ai/editions/{editionId}/translations:
    post:
      summary: "Translate one chapter of an edition the caller holds (T-090, SRS §20.5)"
      description: "Queues a background translation and returns it as PENDING; poll the GET to follow progress. Asking again for a chapter whose current text is already translated or in progress returns that translation without charging the daily allowance again. Requires translation consent."
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [structuralId, targetLanguage]
              properties:
                structuralId: { type: string, minLength: 1, maxLength: 500 }
                targetLanguage: { type: string, description: "A code from AiStatus.translationLanguages" }
      responses:
        "200":
          description: "The translation, pending or already available"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ChapterTranslation" }
        "400": { description: "Unsupported language, a chapter with no text, or a chapter over 120,000 characters" }
        "403": { description: "Translation consent not given" }
        "404": { description: "No digital copy of this edition in the caller's library, or no such chapter" }
        "429": { description: "Daily translation allowance would be exceeded" }
        "503": { description: "AI_UNAVAILABLE" }
    get:
      summary: "The caller's own translations of an edition, with progress (T-090)"
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: targetLanguage
          required: false
          schema: { type: string }
      responses:
        "200":
          description: "Translations, oldest first"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ChapterTranslation" } }

  /editions/{editionId}/annotations:
    get:
      summary: List the caller's highlights and quotes for an edition (SRS §13.2, §13.3)
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's annotations for their copy of this edition
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Annotation" }
        "404": { description: No digital copy of this edition in the caller's library }
    post:
      summary: Create a highlight or quote
      parameters:
        - in: path
          name: editionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, position, text]
              properties:
                kind: { type: string, enum: [HIGHLIGHT, QUOTE] }
                position: { type: string, description: "structuralId/CFI/page — format depends on medium" }
                text: { type: string, maxLength: 10000 }
                color: { type: string, nullable: true }
                note: { type: string, maxLength: 5000, nullable: true }
                tags: { type: array, items: { type: string }, maxItems: 20 }
                sessionId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Annotation" }
        "404": { description: "No digital copy of this edition, or sessionId not owned by caller" }

  /annotations/search:
    get:
      summary: Full-text search across the caller's own highlights, quotes, and notes (SRS §13)
      description: >-
        Postgres full-text search (to_tsvector/plainto_tsquery), scoped
        to the authenticated user only. Relevance ranking is not
        guaranteed, results are newest-first. Semantic/pgvector search
        is Phase 10, not this.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Matching annotations and notes, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }

  /annotations/{id}:
    patch:
      summary: Update a highlight/quote's note, color, or tags
      parameters:
        - $ref: "#/components/parameters/AnnotationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 5000, nullable: true }
                color: { type: string, nullable: true }
                tags: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Annotation" }
        "404": { description: Not found or not owned by caller }
    delete:
      summary: Delete a highlight/quote
      parameters:
        - $ref: "#/components/parameters/AnnotationId"
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned by caller }

  /reading-journeys/{journeyId}/resolve-position:
    post:
      summary: Resolve the canonical position into a target edition's location
      description: Implements the mapping algorithm in SRS §11.7-11.9.
      parameters:
        - in: path
          name: journeyId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [targetEditionId]
              properties:
                targetEditionId: { type: string, format: uuid }
      responses:
        "200":
          description: Resolved location with confidence score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedPositionResponse" }

  /reading-journeys/{journeyId}/position:
    post:
      summary: Confirm or correct the canonical position for a reading journey (SRS §11.5)
      description: >
        Both "confirm this resolved candidate" and "no, actually here"
        are the same operation — telling Bunko the definitive canonical
        position now (T-037). Scoped to the caller's own journey.
      parameters:
        - in: path
          name: journeyId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                structuralId: { type: string, nullable: true }
                chapterLabel: { type: string, nullable: true }
                pageNumber: { type: integer, nullable: true }
      responses:
        "204": { description: Canonical position updated }
        "404": { description: Reading journey not found }

  /reading-sessions:
    post:
      summary: Start a reading session (SRS §12.7-12.9)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copyId]
              properties:
                copyId: { type: string, format: uuid }
                startPosition: { type: string, nullable: true }
      responses:
        "201":
          description: Session started (state ACTIVE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingSessionResponse" }
        "409":
          description: Another session is already ACTIVE for this user

  /reading-sessions/{sessionId}/progress:
    patch:
      summary: Report a position update for an active digital session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: string }
      responses:
        "200": { description: Progress recorded }

  /reading-sessions/pause-active:
    post:
      summary: Pause the user's currently active reading session (SRS §12.7)
      responses:
        "200":
          description: Session paused (or null if none active)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/ReadingSessionResponse"

  /reading-sessions/{sessionId}/pause:
    post:
      summary: Pause an active session (idle timeout, a hidden reader tab, or leaving the reader)
      description: "Paused time is not reading time (SRS §12.8): it is subtracted from the session's durationSeconds. Pausing an already-paused session returns it unchanged. Starting a session again for the same copy within the grace window resumes this one, and so does reporting progress on it."
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingSessionResponse" }

  /reading-sessions/log:
    post:
      summary: "Log a reading session that already happened (SRS §6.3 manual override)"
      description: "Recorded as ENDED. Moves the book's reading position only when it is the most recent reading of that book. With both a start and an end page, the pages count toward statistics."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copyId, minutes]
              properties:
                copyId: { type: string, format: uuid }
                endedAt: { type: string, format: date-time, description: "Defaults to now; can't be in the future" }
                minutes: { type: integer, minimum: 1, maximum: 720 }
                startPosition: { type: string, nullable: true, description: "e.g. \"p. 80\"" }
                endPosition: { type: string, nullable: true, description: "e.g. \"p. 112\"" }
                reflection: { type: string, nullable: true, maxLength: 5000 }
      responses:
        "201":
          description: "The logged session"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingSessionResponse" }
        "400": { description: "Invalid input or a future end time" }
        "404": { description: "Copy not in the caller's library" }

  /reading-sessions/{sessionId}/end:
    post:
      summary: End a session (idempotent, SRS §12.9 step 4-5)
      description: "durationSeconds counts reading time only, without paused time. Repeating the same payload returns the ended session. A reflection may be added afterwards (SRS §12.10) by repeating the call with it, as long as the session has none yet and endPosition is omitted or unchanged; any other change is 409."
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endPosition: { type: string }
                reflection: { type: string, nullable: true }
      responses:
        "200":
          description: Session ended, summary returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingSessionResponse" }

  /journal:
    get:
      summary: Chronological journal of reading sessions (SRS §12.5)
      description: "Ended sessions, most recently finished first (a session logged after the fact sorts by when it ended)."
      parameters:
        - in: query
          name: workId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated journal entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/JournalEntry" }

  /statistics:
    get:
      summary: Reading statistics for the caller (SRS §19.1, §19.3)
      description: >
        Extends the T-023 baseline (booksCompleted, totalMinutesRead,
        currentStreakDays are unchanged — no field removed or renamed).
        Streak days are bucketed in the `tz` time zone. pagesRead is an
        estimate: literal pages for PDF/physical, estimated-equivalent
        pages for EPUB (chapter-granular); sessions whose progress can't be
        resolved are excluded rather than guessed.
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: The caller's statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Statistics" }
        "400": { description: Invalid tz }

  /statistics/trends:
    get:
      summary: Reading activity bucketed by period (SRS §19.2)
      description: >
        daily = last 30 days, weekly = last 12 ISO weeks (Monday start),
        monthly = last 12 months, yearly = every year from the first
        session to now, all-time = one bucket. A session counts toward the
        local day it started in. `totals` cover only the returned window.
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [daily, weekly, monthly, yearly, all-time], default: daily }
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Bucketed activity for the requested range
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Trends" }
        "400": { description: Invalid range or tz }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkId:
      in: path
      name: workId
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    ShelfId:
      in: path
      name: shelfId
      required: true
      schema: { type: string, format: uuid }

    AnnotationId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

    NoteId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

    TabKey:
      in: path
      name: tabKey
      required: true
      description: 'One of: "all", "status:<READING_STATUS>", or "shelf:<uuid>"'
      schema:
        type: string
        pattern: "^(all|status:[A-Z_]+|shelf:[0-9a-f-]{36})$"

    SoundtrackId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

    SoundtrackMappingId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

    TimeZone:
      in: query
      name: tz
      description: >
        IANA time zone the client is viewing from (e.g. "Asia/Kolkata").
        Day boundaries for streaks and trends follow it, DST included.
        Request-supplied rather than stored on the user (T-054).
      schema: { type: string, default: UTC, example: Europe/London }

  schemas:
    BreakdownEntry:
      type: object
      properties:
        label:
          type: string
          nullable: true
          description: null = the book has no value for this dimension (no genre/author, unknown language). For byFormat, an EditionFormat code.
        count: { type: integer }

    Statistics:
      type: object
      properties:
        booksCompleted: { type: integer }
        totalMinutesRead: { type: integer }
        totalSessions: { type: integer }
        averageSessionMinutes: { type: number, nullable: true }
        pagesRead: { type: integer }
        currentStreakDays: { type: integer }
        longestStreakDays: { type: integer }
        pace:
          type: object
          description: All-null until at least 3 sessions with measurable progress totalling 30+ minutes exist (SRS §19.3 "enough reliable data").
          properties:
            pagesPerHour: { type: number, nullable: true }
            pagesPerSession: { type: number, nullable: true }
            sampleSessions: { type: integer }
        breakdowns:
          type: object
          description: Books in the caller's library (any status). A book with copies in two formats counts once in each.
          properties:
            byGenre: { type: array, items: { $ref: "#/components/schemas/BreakdownEntry" } }
            byAuthor: { type: array, items: { $ref: "#/components/schemas/BreakdownEntry" } }
            byLanguage: { type: array, items: { $ref: "#/components/schemas/BreakdownEntry" } }
            byFormat: { type: array, items: { $ref: "#/components/schemas/BreakdownEntry" } }

    TrendBucket:
      type: object
      properties:
        start: { type: string, format: date, description: First local day of the bucket }
        minutesRead: { type: integer }
        sessions: { type: integer }
        pagesRead: { type: integer }

    Trends:
      type: object
      properties:
        range: { type: string, enum: [daily, weekly, monthly, yearly, all-time] }
        timeZone: { type: string }
        buckets: { type: array, items: { $ref: "#/components/schemas/TrendBucket" } }
        totals:
          type: object
          properties:
            minutesRead: { type: integer }
            sessions: { type: integer }
            pagesRead: { type: integer }

    ShelfResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    Annotation:
      type: object
      properties:
        id: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [HIGHLIGHT, QUOTE] }
        position: { type: string }
        text: { type: string }
        color: { type: string, nullable: true }
        note: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        copyId: { type: string, format: uuid, nullable: true }
        sessionId: { type: string, format: uuid, nullable: true }
        scope: { type: string, enum: [BOOK, CHAPTER, SECTION, PAGE, PASSAGE, SESSION] }
        position: { type: string, nullable: true }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        body: { type: string, nullable: true }
        isFavourite: { type: boolean }
        rereadIntention: { type: boolean }
        metadata: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SoundtrackMapping:
      type: object
      properties:
        id: { type: string, format: uuid }
        soundtrackId: { type: string, format: uuid }
        targetType: { type: string, enum: [WORK, SHELF, GENRE, MOOD, SITUATION] }
        targetKey: { type: string, description: "A workId/shelfId, or a normalised label" }
        label: { type: string, nullable: true, description: Book title or shelf name for WORK/SHELF; null for label targets }

    Soundtrack:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, description: "The share link, tracking parameters stripped" }
        provider: { type: string, enum: [SPOTIFY, YOUTUBE, APPLE_MUSIC, SOUNDCLOUD] }
        embedUrl: { type: string, description: "The provider's official embed player URL (derived, never user-supplied)" }
        capabilities:
          type: object
          properties:
            volumeControl: { type: boolean, description: Whether Bunko can set volume; otherwise it lives in the provider's player }
        mappings: { type: array, items: { $ref: "#/components/schemas/SoundtrackMapping" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SoundtrackResolution:
      type: object
      properties:
        match:
          type: object
          nullable: true
          properties:
            soundtrack: { $ref: "#/components/schemas/Soundtrack" }
            via:
              type: object
              properties:
                mappingId: { type: string, format: uuid }
                targetType: { type: string, enum: [WORK, SHELF, GENRE] }
                targetKey: { type: string }
                label: { type: string, nullable: true }

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
        position: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }

    Preference:
      type: object
      properties:
        key: { type: string, enum: [reader-settings, soundtrack] }
        value: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }

    Device:
      type: object
      properties:
        deviceId: { type: string, format: uuid }
        label: { type: string }
        lastSeenAt: { type: string, format: date-time }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        current: { type: boolean }

    SyncEventResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [APPLIED, SKIPPED, CONFLICT, REJECTED] }
        duplicate: { type: boolean, description: "True when this event had already been received" }
        detail: { type: object, additionalProperties: true, description: "Skip or reject reason, or conflict details" }

    PositionSnapshot:
      type: object
      properties:
        structuralId: { type: string, nullable: true }
        chapterLabel: { type: string, nullable: true }
        pageNumber: { type: integer, nullable: true }
        deviceId: { type: string, nullable: true }
        deviceLabel: { type: string, nullable: true }
        at: { type: string, format: date-time }

    SyncConflict:
      type: object
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        title: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        server: { $ref: "#/components/schemas/PositionSnapshot" }
        device: { $ref: "#/components/schemas/PositionSnapshot" }

    AiStatus:
      type: object
      properties:
        available:
          type: object
          properties:
            semanticSearch: { type: boolean }
            generative: { type: boolean }
            translation: { type: boolean }
        consent:
          type: object
          properties:
            semanticSearch: { type: boolean }
            generative: { type: boolean }
            translation: { type: boolean }
            policyVersion: { type: string, nullable: true }
        currentPolicyVersion: { type: string }
        dailyGenerationLimit: { type: integer }
        dailyTranslationChars: { type: integer }
        translationLanguages:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              rtl: { type: boolean }

    AssistantReply:
      type: object
      properties:
        success: { type: boolean }
        status:
          type: string
          enum: [SUCCESS, PARTIAL, CLARIFICATION_REQUIRED, CONFIRMATION_REQUIRED, CANCELLED, LIMITED, FAILED]
        message: { type: string }
        clarificationRequest:
          type: object
          description: "Present for CLARIFICATION_REQUIRED and CONFIRMATION_REQUIRED: the choices to offer as buttons"
          properties:
            question: { type: string }
            reason: { type: string }
            candidates:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  label: { type: string }

    ChapterTranslation:
      type: object
      properties:
        id: { type: string, format: uuid }
        structuralId: { type: string }
        targetLanguage: { type: string }
        status: { type: string, enum: [PENDING, READY, FAILED] }
        segmentsDone: { type: integer }
        segmentsTotal: { type: integer }
        text: { type: string, nullable: true, description: "Set once READY" }
        error: { type: string, nullable: true }
        stale: { type: boolean, description: "The chapter's text has changed since this was translated" }
        model: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        generated: { type: boolean, enum: [true], description: "Always true: a machine translation (SRS §20.5)" }

    AiExcerpt:
      type: object
      properties:
        sourceType: { type: string, enum: [ANNOTATION, NOTE, REVIEW] }
        sourceId: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        score: { type: number }

    AiAnswer:
      type: object
      properties:
        answer: { type: string }
        citations: { type: array, items: { $ref: "#/components/schemas/AiExcerpt" } }
        coveredByNotes: { type: boolean }
        model: { type: string, nullable: true }
        generated: { type: boolean, enum: [true], description: "Always true: an AI interpretation, not a fact (SRS §20.3)" }

    AiSummary:
      type: object
      properties:
        summary: { type: string }
        themes: { type: array, items: { type: string } }
        model: { type: string }
        generated: { type: boolean, enum: [true] }

    AiInsights:
      type: object
      properties:
        insights:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              detail: { type: string }
        model: { type: string }
        generated: { type: boolean, enum: [true] }

    AiRecommendations:
      type: object
      properties:
        recommendations:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              author: { type: string }
              reason: { type: string }
        model: { type: string }
        generated: { type: boolean, enum: [true] }

    SearchResult:
      type: object
      properties:
        type: { type: string, enum: [ANNOTATION, NOTE] }
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        editionId: { type: string, format: uuid, nullable: true }
        excerpt: { type: string }
        createdAt: { type: string, format: date-time }

    ShelfArrangementResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            tabKey: { type: string }
            workIds:
              type: array
              items: { type: string, format: uuid }

    ReadingStatus:
      type: string
      enum: [WANT_TO_READ, READING, FINISHED, DID_NOT_FINISH]

    EditionFormat:
      type: string
      enum: [PHYSICAL, EPUB, PDF]

    SessionStatus:
      type: string
      enum: [ACTIVE, PAUSED, ENDED]

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            user:
              type: object
              properties:
                id: { type: string, format: uuid }
                email: { type: string }
                displayName: { type: string }

    CreateWorkRequest:
      description: >
        Either { workId } to add an existing Work already known to Bunko
        (e.g. a series sibling from another book's page — reuses that
        row rather than creating a title-matching duplicate), or the
        normal new-book/search-candidate shape below.
      oneOf:
        - type: object
          required: [workId]
          properties:
            workId: { type: string, format: uuid }
        - type: object
          required: [title]
          properties:
            title: { type: string }
            authors:
              type: array
              items: { type: string }
            seriesName: { type: string, nullable: true }
            genres:
              type: array
              items: { type: string }
            coverImageUrl: { type: string, nullable: true }
            externalSource:
              type: string
              nullable: true
              description: e.g. "open-library"; omit for a manually-entered book
            externalId:
              type: string
              nullable: true
              description: Provider's stable ID, from a /metadata/search result
            description:
              type: string
              nullable: true
              description: Optional synopsis / summary to pre-populate the Work
            originalLanguage: { type: string, nullable: true }
            language: { type: string, nullable: true }
            partsCount: { type: integer, nullable: true }
            chaptersCount: { type: integer, nullable: true }

    UserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            displayName: { type: string }
            createdAt: { type: string, format: date-time }

    MetadataCandidate:
      type: object
      properties:
        externalSource: { type: string, example: "open-library" }
        externalId: { type: string, example: "OL45804W" }
        title: { type: string }
        authors:
          type: array
          items: { type: string }
        coverImageUrl: { type: string, nullable: true }
        firstPublishYear: { type: integer, nullable: true }
        description: { type: string, nullable: true, description: "Book synopsis or summary if available from provider" }
        seriesName: { type: string, nullable: true, description: "Series or universe name if available" }
        originalLanguage: { type: string, nullable: true }
        language: { type: string, nullable: true }
        partsCount: { type: integer, nullable: true }
        chaptersCount: { type: integer, nullable: true }

    WorkResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            authors:
              type: array
              items: { type: string }
            status: { $ref: "#/components/schemas/ReadingStatus" }
            finishedAt:
              type: string
              format: date-time
              nullable: true
              description: "When the book was marked Finished (SRS §18.2 completion date); null unless its status is FINISHED"
            editions:
              type: array
              items: { $ref: "#/components/schemas/EditionResponse" }
            journeyId:
              type: string
              format: uuid
              nullable: true
              description: >
                Null until the first reading session for this work exists
                (SRS §11 continuity — see ARCHITECTURE.md §3 continuity
                module). Pass to /reading-journeys/:id/resolve-position.
            genres:
              type: array
              items: { type: string }
            seriesName: { type: string, nullable: true }
            shelfIds:
              type: array
              items: { type: string, format: uuid }
            coverImageUrl: { type: string, nullable: true }
            description:
              type: string
              nullable: true
              description: Synopsis, fetched best-effort from Open Library at add time.
            originalLanguage: { type: string, nullable: true }
            language: { type: string, nullable: true }
            partsCount: { type: integer, nullable: true }
            chaptersCount: { type: integer, nullable: true }
            seriesWorks:
              type: array
              description: >
                Other Works sharing this seriesId ("the remaining books
                from that collection"). Only populated on a single-work
                GET, never on the list endpoint.
              items: { $ref: "#/components/schemas/SeriesSiblingResponse" }

    SeriesSiblingResponse:
      type: object
      properties:
        workId: { type: string, format: uuid }
        title: { type: string }
        coverImageUrl: { type: string, nullable: true }
        inLibrary:
          type: boolean
          description: Whether the caller already has this sibling work in their own library.

    WorkListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkResponse" }
        meta:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }

    CreateEditionRequest:
      type: object
      required: [workId, format]
      properties:
        workId: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/EditionFormat" }
        publisher: { type: string, nullable: true }
        language: { type: string, nullable: true }
        isbn: { type: string, nullable: true }

    EditionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/EditionFormat" }
        publisher: { type: string, nullable: true }
        copyId:
          type: string
          format: uuid
          nullable: true
          description: The caller's own copy of this edition, if attached yet.

    CopyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            editionId: { type: string, format: uuid }
            digitalFileId: { type: string, format: uuid, nullable: true }

    DigitalFileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            mimeType: { type: string }
            sizeBytes: { type: integer }
            checksum: { type: string }

    ReaderManifestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            fileUrl: { type: string }
            format: { type: string, enum: [EPUB, PDF] }
            startPosition: { type: string, nullable: true }
            confidence: { type: number, nullable: true }
            sessionId: { type: string, format: uuid }
            workId: { type: string, format: uuid }
            copyId: { type: string, format: uuid }

    ChaptersResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            format: { type: string, enum: [EPUB, PDF] }
            hasTextLayer: { type: boolean }
            chapters:
              type: array
              items:
                type: object
                properties:
                  structuralId: { type: string }
                  label: { type: string }
                  order: { type: integer }
                  pageNumber: { type: integer, nullable: true }
                  text: { type: string }

    ResolvedPositionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            structuralId: { type: string, nullable: true }
            chapterLabel: { type: string, nullable: true }
            confidence: { type: number }
            requiresConfirmation: { type: boolean }

    ReadingSessionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/SessionStatus" }
            startTime: { type: string, format: date-time }
            endTime: { type: string, format: date-time, nullable: true }
            durationSeconds: { type: integer, nullable: true }
            startPosition: { type: string, nullable: true }
            endPosition: { type: string, nullable: true }
            reflection: { type: string, nullable: true }

    # T-049: a journal entry is a session plus the annotations/notes
    # made during it (linked via sessionId) — distinct from
    # ReadingSessionResponse's bare session shape above.
    JournalEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SessionStatus" }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        startPosition: { type: string, nullable: true }
        endPosition: { type: string, nullable: true }
        reflection: { type: string, nullable: true }
        startLabel: { type: string, nullable: true, description: "Where the session started, in words: a chapter title or \"p. 80\"; null when unknown" }
        endLabel: { type: string, nullable: true, description: "Where it stopped, in words" }
        book:
          type: object
          description: "The book the session was with, so an entry can name and link to it"
          properties:
            workId: { type: string, format: uuid }
            title: { type: string }
            coverImageUrl: { type: string, nullable: true }
            format: { type: string, enum: [PHYSICAL, EPUB, PDF] }
        annotations:
          type: array
          items: { $ref: "#/components/schemas/Annotation" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
